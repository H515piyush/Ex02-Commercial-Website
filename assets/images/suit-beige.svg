<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="beigeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7F4EF"/>
      <stop offset="100%" stop-color="#EBE5DC"/>
    </linearGradient>
    <linearGradient id="suitFabric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFD4C6"/>
      <stop offset="50%" stop-color="#D3C5B5"/>
      <stop offset="100%" stop-color="#C5B5A3"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#1F1B16" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="600" height="800" fill="url(#beigeBg)"/>
  <line x1="40" y1="40" x2="560" y2="40" stroke="#DDD4C8" stroke-width="1"/>
  <line x1="40" y1="760" x2="560" y2="760" stroke="#DDD4C8" stroke-width="1"/>
  
  <g filter="url(#softShadow)">
    <path d="M240 110 C270 100, 330 100, 360 110 L380 200 L220 200 Z" fill="#E5DDD2"/>
    <!-- Crisp White Collar -->
    <path d="M270 120 L300 210 L330 120 L315 110 L285 110 Z" fill="#FFFFFF" stroke="#E8E4DD" stroke-width="1"/>
    <path d="M285 110 L300 170 L260 145 Z" fill="#FBFBF9"/>
    <path d="M315 110 L300 170 L340 145 Z" fill="#F5F5F0"/>
    
    <!-- Main Jacket Body -->
    <path d="M170 200 L240 120 L360 120 L430 200 L450 480 C440 650, 420 710, 410 720 L190 720 C180 710, 160 650, 150 480 Z" fill="url(#suitFabric)"/>
    
    <!-- Sleeves -->
    <path d="M170 200 L130 460 C125 540, 130 630, 140 680 L195 670 L180 470 L200 230 Z" fill="#CBBCAB" stroke="#BEAC99" stroke-width="1"/>
    <path d="M430 200 L470 460 C475 540, 470 630, 460 680 L405 670 L420 470 L400 230 Z" fill="#C2B29F" stroke="#B5A38E" stroke-width="1"/>
    
    <!-- Peak Lapels - Italian Sartorial Cut -->
    <path d="M240 120 L220 250 L190 240 L215 320 L300 480 L300 370 Z" fill="#DFD4C7" stroke="#BAA997" stroke-width="1.5"/>
    <path d="M360 120 L380 250 L410 240 L385 320 L300 480 L300 370 Z" fill="#CEBFAD" stroke="#BAA997" stroke-width="1.5"/>
    
    <!-- Breast Pocket and Pocket Square -->
    <rect x="230" y="310" width="65" height="8" rx="1" fill="#C2B19D" stroke="#AFA08C" stroke-width="1" transform="rotate(-5 230 310)"/>
    <path d="M245 308 L260 288 L275 306 Z" fill="#FFFFFF" stroke="#D8C8B6" stroke-width="0.8"/>
    
    <!-- Flap Pockets -->
    <rect x="180" y="540" width="95" height="16" rx="2" fill="#C5B5A3" stroke="#B29F8B" stroke-width="1.2"/>
    <rect x="325" y="540" width="95" height="16" rx="2" fill="#BDAC9A" stroke="#AA9884" stroke-width="1.2"/>
    
    <!-- Pick Stitching -->
    <path d="M218 322 L298 480 L298 715" fill="none" stroke="#A4927E" stroke-width="1" stroke-dasharray="3,3"/>
    <path d="M382 322 L302 480 L302 715" fill="none" stroke="#998773" stroke-width="1" stroke-dasharray="3,3"/>
    
    <!-- Genuine Horn Buttons -->
    <circle cx="312" cy="490" r="8" fill="#2A241E" stroke="#C5A880" stroke-width="1.5"/>
    <circle cx="312" cy="490" r="4" fill="#3D352D"/>
    <circle cx="312" cy="560" r="8" fill="#2A241E" stroke="#C5A880" stroke-width="1.5"/>
    <circle cx="312" cy="560" r="4" fill="#3D352D"/>
    <!-- Cuff Buttons -->
    <circle cx="155" cy="660" r="4" fill="#2A241E"/>
    <circle cx="165" cy="658" r="4" fill="#2A241E"/>
    <circle cx="175" cy="656" r="4" fill="#2A241E"/>
    <circle cx="185" cy="654" r="4" fill="#2A241E"/>
    <circle cx="445" cy="660" r="4" fill="#2A241E"/>
    <circle cx="435" cy="658" r="4" fill="#2A241E"/>
    <circle cx="425" cy="656" r="4" fill="#2A241E"/>
    <circle cx="415" cy="654" r="4" fill="#2A241E"/>
  </g>
  <text x="300" y="775" font-family="'Playfair Display', serif" font-size="12" font-weight="500" fill="#8C7C6D" text-anchor="middle" letter-spacing="4">MILANESE CASHMERE-WOOL BLAZER - CLASSIC BEIGE</text>
</svg>