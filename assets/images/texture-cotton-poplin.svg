<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <pattern id="poplinWeave" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#FAFAF8"/>
      <!-- Fine tight warp and weft -->
      <line x1="0" y1="4" x2="16" y2="4" stroke="#EEEAE2" stroke-width="2"/>
      <line x1="0" y1="12" x2="16" y2="12" stroke="#EEEAE2" stroke-width="2"/>
      <line x1="4" y1="0" x2="4" y2="16" stroke="#FFFFFF" stroke-width="2.5"/>
      <line x1="12" y1="0" x2="12" y2="16" stroke="#FFFFFF" stroke-width="2.5"/>
      <!-- Subtle shadow pinpoints for 3D weave depth -->
      <circle cx="4" cy="4" r="1.2" fill="#DDD7CB" opacity="0.5"/>
      <circle cx="12" cy="12" r="1.2" fill="#DDD7CB" opacity="0.5"/>
    </pattern>
    <filter id="sheenRelief">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="#FFFFFF" surfaceScale="1.5" result="light">
        <feDistantLight azimuth="60" elevation="65"/>
      </feDiffuseLighting>
      <feBlend mode="screen" in="SourceGraphic" in2="light" opacity="0.4"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#poplinWeave)" filter="url(#sheenRelief)"/>
  <rect width="400" height="400" fill="none" stroke="#E2DBD0" stroke-width="2"/>
</svg>