<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <pattern id="cashmereNap" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="30" height="30" fill="#C99F72"/>
      <!-- Soft brushed fibers -->
      <path d="M0 5 Q15 2 30 5 M0 15 Q15 12 30 15 M0 25 Q15 22 30 25" stroke="#DFC09B" stroke-width="2.5" fill="none" opacity="0.8"/>
      <path d="M5 0 Q2 15 5 30 M15 0 Q12 15 15 30 M25 0 Q22 15 25 30" stroke="#B08354" stroke-width="1.8" fill="none" opacity="0.6"/>
      <!-- Cashmere flecks -->
      <circle cx="10" cy="10" r="1" fill="#F4E2CA"/>
      <circle cx="25" cy="20" r="1" fill="#8E653A"/>
    </pattern>
    <filter id="cashmereFuzz">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#cashmereNap)" filter="url(#cashmereFuzz)"/>
  <rect width="400" height="400" fill="none" stroke="#A97E50" stroke-width="2"/>
</svg>