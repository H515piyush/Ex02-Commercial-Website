<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <pattern id="twillPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#D9C9B8"/>
      <!-- Diagonal 2x2 Twill Lines -->
      <line x1="0" y1="0" x2="24" y2="24" stroke="#C5B29F" stroke-width="3"/>
      <line x1="12" y1="0" x2="36" y2="24" stroke="#F4EDE4" stroke-width="1.8"/>
      <line x1="-12" y1="0" x2="12" y2="24" stroke="#F4EDE4" stroke-width="1.8"/>
      <line x1="0" y1="12" x2="24" y2="36" stroke="#9C8774" stroke-width="1.2" opacity="0.6"/>
      <!-- Cross threads -->
      <line x1="24" y1="0" x2="0" y2="24" stroke="#BEAB98" stroke-width="0.8" opacity="0.4"/>
    </pattern>
    <filter id="fabricRelief">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="#FFFDF9" surfaceScale="2" result="light">
        <feDistantLight azimuth="45" elevation="60"/>
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#twillPattern)" filter="url(#fabricRelief)"/>
  <rect width="400" height="400" fill="none" stroke="#B8A38E" stroke-width="2"/>
</svg>