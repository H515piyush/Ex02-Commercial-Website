<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="craftBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6F2EC"/>
      <stop offset="50%" stop-color="#EDE6DC"/>
      <stop offset="100%" stop-color="#DFD7CB"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#craftBg)"/>
  <!-- Atelier Table Silhouette -->
  <line x1="60" y1="60" x2="740" y2="60" stroke="#D3C9BD" stroke-width="1"/>
  <line x1="60" y1="540" x2="740" y2="540" stroke="#D3C9BD" stroke-width="1"/>
  
  <!-- Tailoring Shears -->
  <g transform="translate(160, 200) rotate(-25)">
    <circle cx="50" cy="50" r="28" fill="none" stroke="#2B2621" stroke-width="7"/>
    <circle cx="50" cy="120" r="28" fill="none" stroke="#2B2621" stroke-width="7"/>
    <path d="M75 55 L260 75 L75 95 Z" fill="#8C7F72" stroke="#4A433B" stroke-width="1.5"/>
    <path d="M75 115 L260 95 L75 75 Z" fill="#A89C8E" stroke="#4A433B" stroke-width="1.5"/>
    <circle cx="105" cy="85" r="6" fill="#D4C3B3" stroke="#2B2621" stroke-width="2"/>
  </g>
  
  <!-- Measuring Tape curled -->
  <path d="M350 400 C420 360, 480 430, 560 380 C620 340, 680 410, 720 380" fill="none" stroke="#D4C3B3" stroke-width="22" stroke-linecap="round"/>
  <path d="M350 400 C420 360, 480 430, 560 380 C620 340, 680 410, 720 380" fill="none" stroke="#1A1816" stroke-width="12" stroke-dasharray="2,8" stroke-linecap="round"/>
  
  <!-- Spool of golden silk thread -->
  <g transform="translate(560, 160)">
    <rect x="20" y="40" width="80" height="110" rx="8" fill="#D3BEA2" stroke="#8E7B64" stroke-width="2"/>
    <ellipse cx="60" cy="40" rx="40" ry="12" fill="#BAA385" stroke="#8E7B64" stroke-width="2"/>
    <ellipse cx="60" cy="150" rx="40" ry="12" fill="#BAA385" stroke="#8E7B64" stroke-width="2"/>
    <!-- Thread winding -->
    <line x1="20" y1="55" x2="100" y2="55" stroke="#EFE6D7" stroke-width="3" stroke-dasharray="4,2"/>
    <line x1="20" y1="75" x2="100" y2="75" stroke="#EFE6D7" stroke-width="3" stroke-dasharray="4,2"/>
    <line x1="20" y1="95" x2="100" y2="95" stroke="#EFE6D7" stroke-width="3" stroke-dasharray="4,2"/>
    <line x1="20" y1="115" x2="100" y2="115" stroke="#EFE6D7" stroke-width="3" stroke-dasharray="4,2"/>
    <line x1="20" y1="135" x2="100" y2="135" stroke="#EFE6D7" stroke-width="3" stroke-dasharray="4,2"/>
  </g>
  
  <!-- Label -->
  <text x="400" y="500" font-family="'Playfair Display', serif" font-size="16" font-weight="600" fill="#3D362E" text-anchor="middle" letter-spacing="6">HANDCRAFTED HERITAGE IN BIELLA &amp; MILAN</text>
  <text x="400" y="525" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#807263" text-anchor="middle" letter-spacing="2">60 HOURS OF ARTISANAL TAILORING PER GARMENT</text>
</svg>