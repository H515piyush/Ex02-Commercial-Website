<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="silkFlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5EE"/>
      <stop offset="35%" stop-color="#EEDFC9"/>
      <stop offset="65%" stop-color="#FBF7F1"/>
      <stop offset="100%" stop-color="#D6C1A7"/>
    </linearGradient>
    <pattern id="gauzeWeave" width="10" height="10" patternUnits="userSpaceOnUse">
      <line x1="0" y1="5" x2="10" y2="5" stroke="#FFFFFF" stroke-width="0.8" opacity="0.7"/>
      <line x1="5" y1="0" x2="5" y2="10" stroke="#C8B399" stroke-width="0.8" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#silkFlow)"/>
  <rect width="400" height="400" fill="url(#gauzeWeave)"/>
  <!-- Luminous wave highlights -->
  <path d="M-50 150 C100 50, 250 250, 450 100 L450 450 L-50 450 Z" fill="#FFFFFF" opacity="0.25"/>
  <rect width="400" height="400" fill="none" stroke="#D1BDA3" stroke-width="2"/>
</svg>