<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="knitBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F3"/>
      <stop offset="100%" stop-color="#EBE4D5"/>
    </linearGradient>
    <linearGradient id="knitYarn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4EFE6"/>
      <stop offset="50%" stop-color="#E9E1D2"/>
      <stop offset="100%" stop-color="#DDD3C1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#knitBg)"/>
  <line x1="40" y1="40" x2="560" y2="40" stroke="#E0D7C6" stroke-width="1"/>
  <line x1="40" y1="760" x2="560" y2="760" stroke="#E0D7C6" stroke-width="1"/>
  
  <g>
    <!-- Sweater Torso -->
    <path d="M190 200 L250 140 L350 140 L410 200 L430 680 L170 680 Z" fill="url(#knitYarn)" stroke="#D3C7B5" stroke-width="1"/>
    <!-- Sleeves -->
    <path d="M190 200 L140 460 L185 460 L210 230 Z" fill="#E4DBCB" stroke="#D3C7B5" stroke-width="1"/>
    <path d="M410 200 L460 460 L415 460 L390 230 Z" fill="#D9CFBD" stroke="#C8BCA9" stroke-width="1"/>
    
    <!-- Ribbed Crewneck Collar -->
    <ellipse cx="300" cy="150" rx="50" ry="22" fill="none" stroke="#BAAC98" stroke-width="14" stroke-dasharray="4,3"/>
    <ellipse cx="300" cy="150" rx="50" ry="22" fill="#E5DDD0" stroke="#C3B5A2" stroke-width="2"/>
    
    <!-- Cable Knit Textured Vertical Patterns -->
    <g stroke="#BAAC98" stroke-width="1.8" fill="none" opacity="0.75">
      <path d="M290 180 Q300 210 290 240 Q300 270 290 300 Q300 330 290 360 Q300 390 290 420 Q300 450 290 480 Q300 510 290 540 Q300 570 290 600 Q300 630 290 660"/>
      <path d="M310 180 Q300 210 310 240 Q300 270 310 300 Q300 330 310 360 Q300 390 310 420 Q300 450 310 480 Q300 510 310 540 Q300 570 310 600 Q300 630 310 660"/>
      <line x1="255" y1="190" x2="255" y2="660" stroke-dasharray="6,4" stroke-width="2.5"/>
      <line x1="230" y1="200" x2="230" y2="660" stroke-dasharray="8,3" stroke-width="2"/>
      <line x1="345" y1="190" x2="345" y2="660" stroke-dasharray="6,4" stroke-width="2.5"/>
      <line x1="370" y1="200" x2="370" y2="660" stroke-dasharray="8,3" stroke-width="2"/>
    </g>
    
    <!-- Bottom Hem Ribbing -->
    <rect x="170" y="645" width="260" height="35" fill="#DDD3C1" stroke="#C3B5A2" stroke-width="1"/>
    <line x1="170" y1="662" x2="430" y2="662" stroke="#B8A995" stroke-width="12" stroke-dasharray="3,3"/>
  </g>
  <text x="300" y="775" font-family="'Playfair Display', serif" font-size="12" font-weight="500" fill="#7A6D5D" text-anchor="middle" letter-spacing="4">ROYAL MERINO CABLE-KNIT SWEATER - ECRU BEIGE</text>
</svg>